  const clubs = [...new Set(hits.map(x => x.t.a))];
  el.innerHTML = `<p class="note">${hits.length} team${hits.length === 1 ? '' : 's'}${clubs.length && clubs.length <= 3 ? ` · see ${clubs.map(c => `<a href="#clubs" data-club="${esc(c)}">${esc(c)}</a>`).join(', ')} on Clubs` : ''}</p>
  ${hits.length ? `<div class="tframe"><table><thead><tr><th class="l">Team</th><th class="l">Category</th><th>Rank</th><th>Power</th><th>Record</th></tr></thead><tbody>${hits.slice(0, 80).map(({ div, t, rk }) => `<tr>
    <td class="l team">${starBtn(div, t.id)}<a href="#${div}-team-${t.id}">${esc(t.n)}</a><small>${esc(t.lg || t.a)}</small></td>
    <td class="l">${esc(t.c)}</td><td class="num">${rk ? `${rk[0]}/${rk[1]}` : '–'}</td><td class="num">${sgn(power(S.data[div], t))}</td><td class="num">${t.w}-${t.l}-${t.t}</td></tr>`).join('')}</tbody></table></div>
    ${hits.length > 80 ? '<p class="note">Showing the first 80. Add a word to narrow it down.</p>' : ''}` : '<p class="note">No teams match. Try just the club name.</p>'}`;
}
function bindSearch() {
  const q = $('#sq'); if (!q) return;
  q.focus();
  q.oninput = () => { S.sq = q.value; if (Object.keys(S.data).length === S.index.divisions.length) runSearch(); };
  $('#app').onclick = e => { const c = e.target.closest('[data-club]'); if (c) { S.cq = c.dataset.club; S.clubAll = true; } };
}

/* ---------- events ---------- */
function bind(D) {
  hideTip();
  const app = $('#app');
  app.onclick = e => {
    const b = e.target.closest('button'); const a = e.target.closest('[data-cat-link]');
    if (a) { S.cat[a.dataset.catDiv || S.div] = a.dataset.catLink; return; }
    if (!b) return;
    if (b.dataset.hcat) { S.cat[S.div] = b.dataset.hcat; app.innerHTML = viewHome(D); bind(D); }
    else if (b.dataset.pdiv) { S.wq = ''; store('rr-div', b.dataset.pdiv); go(`${b.dataset.pdiv}-home`); }
    else if (b.dataset.wclub) { S.wq = b.dataset.wclub; app.innerHTML = viewHome(D); bind(D); const w = $('#wq'); if (w) { w.focus(); w.setSelectionRange(w.value.length, w.value.length); } }
    else if (b.dataset.pick) {
      const key = b.dataset.pick, [pd, pid] = key.split(':'), PD = S.data[pd], pt = PD && PD.teams[pid];
      if (!isStar(pd, pid)) toggleStar(key);
      S.homeStar = key; store('rr-home', key); S.wq = ''; S.addMode = false;
      if (pt) { S.level = levelOf(pt.c); S.gender = genderOf(pt.c); store('rr-level', S.level); store('rr-gender', S.gender); chrome(); toast(`Following ${shortName(pt)}. Welcome to RinkRank!`); }
      app.innerHTML = viewHome(D); bind(D); window.scrollTo(0, 0);
    }
    else if (b.dataset.addteam) { S.addMode = !S.addMode; app.innerHTML = viewHome(D); bind(D); const w = $('#welcome'); if (w) w.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (b.dataset.rscope) { S.rscope = b.dataset.rscope; const y = window.scrollY; app.innerHTML = viewHome(D); bind(D); window.scrollTo(0, y); }
    else if (b.dataset.hstar) { S.homeStar = b.dataset.hstar; store('rr-home', S.homeStar); app.innerHTML = viewHome(D); bind(D); }
    else if (b.dataset.cat) { S.cat[S.div] = b.dataset.cat; S.q = ''; app.innerHTML = viewRankings(D); bind(D); }
    else if (b.dataset.region) { S.region = b.dataset.region; app.innerHTML = viewRankings(D); bind(D); }
    else if (b.dataset.sort) { S.sort = b.dataset.sort; app.innerHTML = viewRankings(D); bind(D); }
    else if (b.dataset.gcat) { S.gamesCat = b.dataset.gcat; app.innerHTML = viewGames(D); bind(D); }
    else if (b.dataset.rcat) { S.recCat = b.dataset.rcat; S.recShow = 40; app.innerHTML = viewRecord(D); bind(D); }
    else if (b.dataset.more) { const y = window.scrollY; S.recShow = (S.recShow || 40) + 40; app.innerHTML = viewRecord(D); bind(D); window.scrollTo(0, y); }
    else if (b.dataset.pkind) { S.pkind = b.dataset.pkind; app.innerHTML = viewLeagues(D); bind(D); }
  };
  const q = $('#q');
  if (q) q.oninput = () => { S.q = q.value; const pos = q.selectionStart; app.innerHTML = viewRankings(D); bind(D); const nq = $('#q'); nq.focus(); nq.setSelectionRange(pos, pos); };
  const wq = $('#wq');
  if (wq) wq.oninput = () => { S.wq = wq.value; $('#wres').innerHTML = welcomeResults(D); const cc = $('.clubchips'); if (cc) cc.hidden = !!S.wq; };
  const hp = $('#hpick');
  if (hp) hp.onchange = () => { if (!hp.value) return; toggleStar(`${S.div}:${hp.value}`); S.homeStar = `${S.div}:${hp.value}`; store('rr-home', S.homeStar); const y = window.scrollY; app.innerHTML = viewHome(D); bind(D); window.scrollTo(0, y); };
  const vs = $('#vs');
  if (vs) vs.onchange = () => {
    const t = D.teams[S.team], o = D.teams[vs.value];
    if (!o) { $('#vsout').textContent = 'Pick an opponent to see how they compare on neutral ice.'; return; }
    const m = matchup(D, t, o);
    $('#vsout').innerHTML = `${strengthBar(m.ph, m.pt, m.pa, t, o)}
      <p style="margin:10px 0 0"><a href="#${S.div}-match-${t.id}-${o.id}">Full matchup report →</a></p>`;
  };
}
document.addEventListener('click', e => {
  const b = e.target.closest('#divs button'); if (!b) return;
  const v = ['team', 'game', 'match'].includes(S.view) || GLOBAL_VIEWS.has(S.view) ? 'home' : S.view;
  S.q = ''; store('rr-div', b.dataset.div); go(`${b.dataset.div}-${v}`);
});
window.addEventListener('hashchange', render);
document.addEventListener('click', e => {
  const mb = e.target.closest('#modes button'); if (!mb) return;
  S.simple = mb.dataset.mode === 'simple'; store('rr-mode', mb.dataset.mode);
  document.body.classList.toggle('simple', S.simple); chrome();
});
document.addEventListener('click', e => {
  const gb = e.target.closest('#genders button');
  if (gb && gb.dataset.gender !== S.gender) {
    S.gender = gb.dataset.gender; store('rr-gender', S.gender); S.gamesCat = 'all'; S.recCat = 'all'; S.q = '';
    if (S.view === 'team') go(`${S.div}-rankings`); else render();
    return;
  }
  const b = e.target.closest('#levels button'); if (!b || b.dataset.level === S.level) return;
  S.level = b.dataset.level; store('rr-level', S.level); S.gamesCat = 'all'; S.q = '';
  if (S.view === 'team') go(`${S.div}-rankings`); else render();
});
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-star]'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  toggleStar(b.dataset.star);
  const [div, id] = b.dataset.star.split(':');
  document.querySelectorAll(`button[data-star="${b.dataset.star}"]`).forEach(x => { x.outerHTML = starBtn(div, +id, x.classList.contains('big')); });
  if ($('#mine')) fillMine();
  if (S.view === 'home' && S.data[S.div]) { const y = window.scrollY; $('#app').innerHTML = viewHome(S.data[S.div]); bind(S.data[S.div]); window.scrollTo(0, y); }
}, true);
function bindClubs() {
  const app = $('#app');
  app.onclick = e => { const b = e.target.closest('button[data-clubs]'); if (b) { S.clubAll = b.dataset.clubs === 'all'; app.innerHTML = viewClubs(S.clubs); bindClubs(); } };
  const q = $('#cq');
  if (q) q.oninput = () => { S.cq = q.value; const pos = q.selectionStart; app.innerHTML = viewClubs(S.clubs); bindClubs(); const nq = $('#cq'); nq.focus(); nq.setSelectionRange(pos, pos); };
}

/* ---------- tooltips: hover on desktop, tap on touch, focus for keyboards ---------- */
const tipEl = $('#tip'); let tipFor = null, tipTimer = null;
function showTip(el) {
  const g = GLOSS[el.dataset.tip]; if (!g) return;
  tipFor = el; tipEl.innerHTML = `<b>${esc(g[0])}</b>${esc(g[1])}`; tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), window.innerWidth - w - 16);
  let y = r.bottom + 8; if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 8);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip() { tipEl.hidden = true; tipFor = null; clearTimeout(tipTimer); }
document.addEventListener('mouseover', e => { if (e.pointerType === 'touch') return; const el = e.target.closest('[data-tip]'); if (el && el !== tipFor) showTip(el); else if (!el && tipFor) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  const el = e.target.closest('[data-tip]');
  if (!el) { hideTip(); return; }
  if (tipFor === el) { hideTip(); return; }
  showTip(el); clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 6000);
});
window.addEventListener('scroll', () => { if (tipFor) hideTip(); }, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });

(async function start() {
  try { S.index = await getJSON('data/index.json'); }
  catch (e) { $('#app').innerHTML = '<p class="loading">The ratings didn\'t load. Refresh the page to try again.</p>'; return; }
  S.level = store('rr-level') === 'house' ? 'house' : 'rep';
  S.gender = store('rr-gender') === 'female' ? 'female' : 'mixed';
  // Simple view hides the analyst columns. Phones start in it unless the visitor chose otherwise.
  const mode = store('rr-mode'); S.simple = mode ? mode === 'simple' : window.innerWidth < 640;
  document.body.classList.toggle('simple', S.simple);
  const saved = store('rr-div'); if (saved && S.index.divisions.some(d => d.id === saved)) S.div = saved;
  else if (!S.index.divisions.some(d => d.id === 'u13')) S.div = S.index.divisions[0].id;
  render();
})();
</script>
