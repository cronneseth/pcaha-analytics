<style>
/* Layout: a rink-side stats board. Sticky scoreboard header, one reading column, wide tables scroll inside their own frames. */
:root {
  --ice: #f2f5f7;        /* page: fresh ice */
  --board: #ffffff;      /* raised surfaces: the boards */
  --ink: #14202a;
  --muted: #5b6b78;
  --line: #d8e0e6;
  --red: #c8203a;        /* goal-light red, used sparingly */
  --blue: #1d5bb8;       /* blue line: links and our marks */
  --blue-soft: #e3ecf8;
  --good: #1e7f4f;
  --bad: #b3261e;
  --tie: #8a6d1f;
  --bar: #c9d5df;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ice: #0d141a; --board: #141e26; --ink: #e4ebf0; --muted: #91a2b0; --line: #26343f;
  --red: #ff5a6e; --blue: #6ea5ff; --blue-soft: #1b2a3c; --good: #4cc68a; --bad: #ff7a70; --tie: #d9b55a; --bar: #2c3b47;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ice: #0d141a; --board: #141e26; --ink: #e4ebf0; --muted: #91a2b0; --line: #26343f;
  --red: #ff5a6e; --blue: #6ea5ff; --blue-soft: #1b2a3c; --good: #4cc68a; --bad: #ff7a70; --tie: #d9b55a; --bar: #2c3b47;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--ice); color: var(--ink); font: 16px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--board); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; color: var(--ink); }
.brand b { font: 800 28px/1 var(--display); letter-spacing: .5px; text-transform: uppercase; }
.brand b i { font-style: normal; color: var(--red); }
.brand span { font-size: 13px; color: var(--muted); }
.divs { display: flex; gap: 4px; }
.divs button { font: 600 15px/1 var(--display); letter-spacing: .5px; padding: 7px 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; cursor: pointer; }
.divs button[aria-pressed="true"] { background: var(--ink); color: var(--board); border-color: var(--ink); }
.levels { padding: 3px; border: 1px solid var(--line); border-radius: 8px; gap: 2px; }
.levels button { border: 0; padding: 6px 12px; }
.levels button[aria-pressed="true"] { background: var(--red); color: #fff; }
nav.views { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
nav.views a { padding: 6px 10px; border-radius: 6px; color: var(--muted); font-weight: 600; }
nav.views a[aria-current="page"] { color: var(--ink); background: var(--blue-soft); text-decoration: none; }
/* the red line under the header */
.redline { height: 3px; background: linear-gradient(90deg, var(--blue) 0 20%, transparent 20% 40%, var(--red) 40% 60%, transparent 60% 80%, var(--blue) 80%); opacity: .85; }

main { padding-block: 24px 64px; }
h1 { font: 800 clamp(30px, 5vw, 44px)/1.02 var(--display); text-transform: uppercase; letter-spacing: .3px; margin: 0 0 6px; text-wrap: balance; }
h2 { font: 800 24px/1.1 var(--display); text-transform: uppercase; letter-spacing: .4px; margin: 34px 0 10px; text-wrap: balance; }
h3 { font: 700 16px/1.3 var(--body); margin: 0 0 6px; }
.lede { color: var(--muted); max-width: 68ch; margin: 0 0 18px; }
.eyebrow { font: 600 12px/1 var(--mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); max-width: 72ch; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 4px 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 14px/1 var(--body); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--board); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip small { font-weight: 400; opacity: .75; margin-left: 4px; }
select, input[type="search"] { font: 15px var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--board); color: var(--ink); max-width: 100%; }
input[type="search"] { min-width: 0; width: 220px; }

/* tables */
.tframe { overflow-x: auto; background: var(--board); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font: 600 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .8px; color: var(--muted); position: sticky; top: 0; background: var(--board); }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
th button[data-active="true"] { color: var(--ink); }
td.l, th.l { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--blue-soft); }
.team { white-space: normal; min-width: 190px; }
.team a { font-weight: 700; color: var(--ink); }
.team small { display: block; color: var(--muted); font-size: 13px; }
.rank { font: 800 20px/1 var(--display); width: 2.2em; }
.mv { font: 600 12px var(--mono); }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
.prov { font: 600 10px var(--mono); color: var(--tie); border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 2px; }

.power { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.pbar { width: 74px; height: 8px; background: var(--bar); border-radius: 4px; position: relative; overflow: hidden; }
.pbar i { position: absolute; top: 0; bottom: 0; background: var(--blue); }
.pbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }

.form { display: inline-flex; gap: 2px; }
.form b { width: 18px; height: 18px; border-radius: 3px; font: 600 11px/18px var(--mono); text-align: center; color: #fff; }
.form .W { background: var(--good); } .form .L { background: var(--bad); } .form .T { background: var(--tie); }

/* cards and tiles: used only on the team page summary */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; }
.tile { background: var(--board); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .v { font: 800 30px/1.05 var(--display); }
.tile .k { font: 600 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.tile .s { font-size: 13px; color: var(--muted); margin-top: 2px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.grid2 > * { min-width: 0; }
.panel { background: var(--board); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

.report { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.report li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.report li::before { content: attr(data-tag); font: 700 11px/22px var(--mono); text-align: center; border-radius: 4px; height: 22px; }
.report li[data-tag="+"]::before { background: var(--good); color: #fff; }
.report li[data-tag="−"]::before { background: var(--bad); color: #fff; }
.report li[data-tag="i"]::before { background: var(--bar); color: var(--ink); }

/* game cards */
.days { display: grid; gap: 22px; }
.day h3 { font: 700 13px/1 var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 8px; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.game { background: var(--board); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.game.watch { border-color: var(--red); }
.game .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.game .meta span:last-child { text-align: right; }
.side { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; }
.side a { font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.side .num { font-weight: 600; }
.odds { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--bar); }
.odds i { display: block; }
.odds .h { background: var(--blue); } .odds .t { background: var(--muted); opacity: .45; } .odds .a { background: var(--red); }
.oddslbl { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
.odds3 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; font: 12px/1.3 var(--body); color: var(--muted); }
.odds3 span:nth-child(2) { text-align: center; }
.odds3 span:last-child { text-align: right; }
.odds3 b { display: block; font: 700 16px/1.2 var(--mono); }
.odds3 span:first-child b { color: var(--blue); }
.odds3 span:last-child b { color: var(--red); }
.tag { font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .8px; color: var(--red); }

.cal { width: 100%; max-width: 420px; }
.cal text { fill: var(--muted); font: 11px var(--mono); }
[data-tip] { cursor: help; }
span[data-tip], .k[data-tip] { text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 3px; }
th button[data-tip] { text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 3px; }
#tip { position: fixed; z-index: 30; max-width: min(320px, calc(100vw - 32px)); background: var(--ink); color: var(--board); font: 14px/1.45 var(--body); padding: 10px 12px; border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .22); pointer-events: none; text-align: left; white-space: normal; }
#tip b { display: block; font: 700 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 3px; }
.gloss { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 10px 18px; margin: 0; }
.gloss dt { font-weight: 700; }
.gloss dd { margin: 0; color: var(--ink); }
@media (max-width: 520px) { .gloss { grid-template-columns: 1fr; gap: 2px 0; } .gloss dd { margin-bottom: 10px; } }
.star { background: none; border: 0; padding: 0 6px 0 0; font-size: 17px; line-height: 1; color: var(--muted); cursor: pointer; vertical-align: 1px; }
.star[aria-pressed="true"] { color: var(--tie); }
.star.big { font-size: 28px; vertical-align: 4px; padding-left: 4px; }
.mine-wrap { margin-bottom: 22px; }
.mine { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.minecard { display: grid; gap: 4px; background: var(--board); border: 1px solid var(--line); border-left: 4px solid var(--tie); border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: 14px; min-width: 0; }
.minecard:hover { text-decoration: none; border-color: var(--blue); }
.minecard > b { font-size: 16px; }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
ul.plain .note { font-size: 13px; }
.clubteams { margin: 8px 0 4px; padding-left: 18px; display: grid; gap: 4px; font-weight: 400; }
details summary { cursor: pointer; }
a.preview { font-weight: 600; white-space: nowrap; }
.matchtitle { font-size: clamp(26px, 4.2vw, 38px); }
.matchodds { display: grid; gap: 10px; max-width: 640px; }
.matchodds .side a { font-size: 18px; }
.num.big { font: 800 32px/1 var(--display); }
table.compare th { text-align: center; white-space: normal; font: 700 13px/1.25 var(--body); text-transform: none; letter-spacing: 0; color: var(--ink); }
table.compare th a { color: var(--ink); }
table.compare td { text-align: center; }
table.compare td.mid, table.compare th.mid { color: var(--muted); font-size: 13px; width: 38%; }
table.compare td.win { font-weight: 700; color: var(--blue); }
.favh { color: var(--blue); font-weight: 700; } .fava { color: var(--red); font-weight: 700; }
.sbar { display: grid; gap: 5px; }
.sbar-names { display: flex; justify-content: space-between; gap: 10px; font: 600 12px/1.2 var(--body); color: var(--muted); }
.sbar-names span:last-child { text-align: right; }
.sbar-track { position: relative; display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--bar); }
.sbar-track .sa { background: var(--blue); } .sbar-track .sb { background: var(--red); }
.sbar-label { font: 700 13px/1.2 var(--body); text-align: center; color: var(--muted); }
.sbar-label.fa { color: var(--blue); } .sbar-label.fb { color: var(--red); }
.sbar.small .sbar-track { height: 8px; width: 80px; }
.trend { display: inline-flex; align-items: center; gap: 6px; }
.sharebtn { font: 600 14px/1 var(--body); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--blue); background: var(--board); color: var(--blue); cursor: pointer; vertical-align: 8px; text-transform: none; letter-spacing: 0; }
.sharebtn:hover { background: var(--blue); color: #fff; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--board); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 40; max-width: calc(100vw - 32px); overflow-wrap: anywhere; }
footer b { display: inline-block; margin-top: 6px; color: var(--ink); font-weight: 600; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; padding-block: 18px 30px; }
.loading { color: var(--muted); padding: 40px 0; }
/* dashboard: a 12-column grid of panels that stacks on phones */
.dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.dash > .panel { min-width: 0; grid-column: auto; }
.dash h2 { margin: 0 0 10px; font-size: 21px; }
.phead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.phead a { font-weight: 600; font-size: 14px; white-space: nowrap; }
.feature { border-top: 4px solid var(--red); }
.feature h3 { font: 800 clamp(22px, 3vw, 28px)/1.1 var(--display); text-transform: uppercase; margin: 4px 0 10px; }
.feature h3 a { color: var(--ink); }
.minirank { width: 100%; }
.minirank td { padding: 7px 6px; }
.minirank .team { min-width: 0; }
.grow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.grow:last-child { border-bottom: 0; }
.grow .who { font-weight: 700; color: var(--ink); overflow-wrap: anywhere; line-height: 1.3; }
.grow .who small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.grow .edge { font: 600 13px/1.2 var(--body); text-align: right; white-space: nowrap; }
.grow .sbar { grid-column: 1 / -1; }
.grow .sbar .sbar-track { height: 6px; }
.snapname { font: 800 22px/1.15 var(--display); text-transform: uppercase; margin: 2px 0 4px; }
.snapname a { color: var(--ink); }
.snap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.snap > div { background: var(--ice); border-radius: 8px; padding: 8px 10px; }
.snap .k { font: 600 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.snap .v { font: 800 22px/1.15 var(--display); }
.myteam { border-top: 4px solid var(--tie); }
.dash .wide { grid-column: 1 / -1; }
.homehead { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 14px 24px; align-items: center; margin-bottom: 18px; }
.homehead .lede { margin-bottom: 0; }
/* share card: navy panel, red-white-red stripe, one row of white pills */
.sharecard { position: relative; overflow: hidden; background: linear-gradient(135deg, #123a7a, #1d5bb8); color: #fff; border: 0; border-radius: 10px; padding: 16px 16px 14px; }
.sharecard::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, #c8203a 0 40%, #fff 40% 60%, #c8203a 60%); }
.sharecard h2 { margin: 0 0 2px; font-size: 18px; color: #fff; }
.sharecard p { margin: 0 0 10px; font-size: 13px; color: rgba(255, 255, 255, .85); }
.sharebtns { display: flex; flex-wrap: wrap; gap: 6px; }
.sharebtns a, .sharebtns button { font: 600 13px/1 var(--body); padding: 8px 11px; border-radius: 999px; border: 0; background: #fff; color: #123a7a; cursor: pointer; text-decoration: none; }
.sharebtns a:hover, .sharebtns button:hover { background: #e3ecf8; text-decoration: none; }
.sharebtns .native { background: #c8203a; color: #fff; }
.sharebtns .native:hover { background: #a81a30; }
.wkrow { display: grid; grid-template-columns: 150px 1fr auto auto; gap: 4px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wkrow:last-child { border-bottom: 0; }
.wkrow .who small { display: block; color: var(--muted); font-size: 13px; }
.wkrow .edge { font: 600 13px/1.2 var(--body); white-space: nowrap; }
.summary { font-size: 17px; line-height: 1.55; max-width: 72ch; margin: 0 0 6px; }
.panel .summary { font-size: 16px; }
.outlook { border-left: 4px solid var(--blue); }
/* first visit: who do you cheer for? */
.welcome { position: relative; overflow: hidden; background: linear-gradient(135deg, #123a7a, #1d5bb8); color: #fff; border: 0; padding: 26px 24px 22px; }
.welcome::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; background: linear-gradient(90deg, #c8203a 0 40%, #fff 40% 60%, #c8203a 60%); }
.welcome-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); grid-template-areas: "head picker" "perks picker"; gap: 4px 32px; align-items: start; }
.welcome-grid .w-head { grid-area: head; } .welcome-grid .w-perks { grid-area: perks; } .welcome-grid .picker { grid-area: picker; }
.sharecard.bottom { display: none; }
.welcome .eyebrow { color: rgba(255, 255, 255, .75); }
.welcome h2.welcome-h { font-size: clamp(30px, 4.4vw, 44px); margin: 6px 0 8px; color: #fff; }
.welcome p { margin: 0 0 12px; color: rgba(255, 255, 255, .9); }
.welcome .note { color: rgba(255, 255, 255, .7); }
.perks { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.perks li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; color: rgba(255, 255, 255, .92); }
.perks li::before { content: "\2713"; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #c8203a; color: #fff; font: 700 13px/1 var(--body); margin-top: 1px; }
.perks b { color: #fff; }
.picker { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18); border-radius: 12px; padding: 14px; }
.picker .lbl { font: 600 12px/1 var(--mono); text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, .75); margin: 0 0 8px; }
.picker .chips { margin-bottom: 12px; }
.picker .chip { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .4); }
.picker .chip[aria-pressed="true"] { background: #fff; color: #123a7a; border-color: #fff; }
.picker input[type="search"] { width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 0; color: #14202a; background: #fff; }
.wres { display: grid; gap: 6px; margin-top: 10px; }

<header>
  <div class="wrap bar">

<footer class="wrap" id="foot"></footer>
<div id="tip" role="tooltip" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = { index: null, data: {}, div: 'u13', view: 'rankings', team: null, cat: {}, region: 'pcaha', q: '', sort: 'power', gamesCat: 'all' };
const VIEWS = [['home','Home'],['rankings','Rankings'],['week','This week'],['games','Games'],['leagues','Projections'],['record','Track record'],['clubs','Clubs'],['search','Search'],['method','How it works']];
const GLOBAL_VIEWS = new Set(['clubs', 'method', 'search']);
const LEVELS = [['rep', 'Rep'], ['house', 'House']];
const levelOf = c => /\bC\b/.test(c || '') ? 'house' : 'rep';
const GENDERS = [['mixed', 'Mixed'], ['female', 'Female']];
const genderOf = c => /Female$/.test(c || '') ? 'female' : 'mixed';
const inLevel = c => levelOf(c) === S.level && genderOf(c) === S.gender;
const levelName = () => (S.gender === 'female' ? 'female ' : '') + (S.level === 'house' ? 'house' : 'rep');
const REGIONS = [['pcaha','PCAHA'],['island','Island'],['all','All']];

const GLOSS = {
  rank: ['Rank', 'Position by Power among the teams shown. Change the filter and the ranks change with it.'],
  move: ['Movement', 'Places gained or lost compared with the ratings two weeks ago. "new" means the team had no rating then.'],
  record: ['Record', 'Wins, losses and ties in every game this season: placement, league, playoffs and tournaments.'],
  power: ['Power', 'Goal differential per game you would expect against an average team in this category, on neutral ice. +2.0 means about two goals better than average. It accounts for who each team played.'],
  gf: ['GF*', 'Goals per game this team would be expected to score against an average opponent in the age group. The offence rating.'],
  ga: ['GA*', 'Goals per game this team would be expected to allow against an average opponent in the age group. The defence rating; lower is better.'],
  sched: ['Schedule strength', 'Average Power of the opponents this team has played, compared with the category average. Positive means a tougher schedule than most.'],
  luck: ['Record vs play', 'Points percentage minus the points percentage the team would usually earn from its game-by-game chances. Big positive numbers often mean close wins that tend not to last; big negative numbers suggest a better team than the record shows.'],
  form: ['Last 5', 'Results of the five most recent games, newest on the left: W win, L loss, T tie.'],
  pp: ['Power play %', 'Power-play goals divided by power-play chances. Chances are estimated from the other team\'s minor, major and match penalties, so coincidental penalties count slightly too many. Shown after six or more chances.'],
  pk: ['Penalty kill %', 'Share of this team\'s penalties that ended without a power-play goal against. Estimated the same way as the power play. Shown after six or more penalties.'],
  early: ['Early', 'Fewer than six games played. The rating is held close to average until more results come in, so expect it to move.'],
  region: ['Teams shown', 'PCAHA: teams in PCAHA placement, league or playoff schedules. Island: Vancouver Island (VIAHA) teams. All: both. Teams from outside the region seen only in tournaments are rated through those games but not ranked.'],
  pts: ['Pts', 'Points in the league standings so far.'],
  gp: ['GP', 'League games played so far.'],
  left: ['Left', 'League games still on the schedule.'],
  projected: ['Projected', 'Average final points across 4,000 simulated finishes of the league schedule.'],
  p1: ['1st', 'Share of simulations where the team finished first in its group.'],
  top: ['Top half', 'Share of simulations where the team finished in the top half of its group.'],
  avgfin: ['Avg finish', 'Average final position in the group across all simulations.'],
  winchance: ['Going in', 'The chance the model gave this team before the game, using only results up to then. Grey numbers are early-season games, before both teams had played three times; those use today\'s ratings.'],
  vsexp: ['Vs expected', 'Actual goal margin minus the margin the ratings expected. +2.0 means the team did two goals better than expected that day.'],
  odds: ['Strength bar', 'How the two teams compare going in. The longer side has the edge. Words: Even, Slight edge, Clear edge or Strong favourite. It comes from the same ratings as everything else; we show it as a bar rather than percentages because these are kids\' games. It isn\'t for betting.'],
  expgoals: ['Expected goals', 'The average score the ratings predict for this game.'],
  watch: ['Game to watch', 'Both teams are in the top quarter of their category and the odds are close.'],
  upset: ['Winner going in', 'How the winner looked before the game: from Strong favourite to Big challenge. Wins from Tough game or Big challenge are the upsets.'],
  offence: ['Offence', 'Expected goals for per game against an average opponent in the age group.'],
  defence: ['Defence', 'Expected goals against per game against an average opponent in the age group. Lower is better.'],
  splits: ['One-goal games', 'Record in games decided by a single goal. Teams that win most of these often have a positive Record vs play number.'],
  logloss: ['Odds error', 'Log loss: the average penalty for the chance given to what actually happened. Saying 90% and being wrong costs much more than saying 55% and being wrong. Lower is better; it rewards honest percentages, not just correct picks.'],
  trend: ['Trend', 'The club\'s score in each of the last three seasons and now, for the teams selected at the top (rep or house, mixed or female). The number is the change since last season. Past seasons are rated the same way, from that season\'s games.'],
  status: ['Status', 'What the points table already guarantees, whatever happens in the games left: clinched first, top half clinched, out of first or out of the top half. "8 pts clinches first" is how many more points guarantee first. Tie-breakers aren\'t in the public data, so a tie on points never counts as clinched.'],
  picked: ['Winner called', 'Share of games with a winner where the team the model favoured beforehand won. Ties are left out.'],
  baseline: ['Better record', 'The simple alternative: before each game, pick whichever team had the better points percentage so far. The model should beat this.'],
  confident: ['Confident calls', 'Games where the model gave one team 70% or more before the game, and how often that team won.'],
  calib: ['Honest odds', 'Games are grouped by how confident the model was. If the odds are honest, teams given 60% win about 60% of the time, teams given 80% about 80%.'],
  source: ['Source', 'Published: the odds this site showed before the game, saved and never changed. Replayed: odds rebuilt for games before launch, using only results from before that day.'],
  level: ['Rep and House', 'Rep is A, AA, AAA and U11 Select teams. House is C teams. The switch at the top filters every page; ratings are calculated across all games either way.'],
  gender: ['Mixed and Female', 'Mixed is the open program; Female is girls-only teams and leagues. The switch at the top filters every page. Female and mixed teams that meet in tournaments are rated on the same scale.'],
  hist: ['Power by week', 'The team\'s Power at the end of each week, refitted using only the games played up to then. The dashed line is the category average; the numbers are the rank at the start and now.'],
  cpct: ['Category percentile', 'Share of teams in the same category (for example U13 A) that a team is rated above. 50 is a typical team; 90 means better than nine in ten.'],
  topq: ['Top 25%', 'How many of the association\'s teams sit in the top quarter of their category.'],
  poolwin: ['Pool win', 'Share of simulations where the team finished first in its tournament pool, on points and then goal difference.'],
  need: ['For top half', 'How many of the games left a team needs to win to finish in the top half of its group in most (three in four) simulations. "Looks safe" means it gets there almost whatever happens; "Long shot" means it would take a big run plus some help from other results.'],
  ahead: ['What\'s ahead', 'The next scheduled games, with how each one looks going in using today\'s ratings. Games further out will look different by the time they come.'],
  depth: ['Goals from top three', 'Share of the team\'s goals scored by its three leading scorers. High numbers mean the offence depends on a few players.'],
};
const tipAttr = k => GLOSS[k] ? ` data-tip="${k}"` : '';
const tipSpan = (k, label) => `<span tabindex="0"${tipAttr(k)}>${label}</span>`;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

async function getJSON(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); }
async function loadDiv(div) { if (!S.data[div]) S.data[div] = await getJSON(`data/${div}.json`); return S.data[div]; }

const fmt = (x, d = 1) => x == null ? '–' : Number(x).toFixed(d);
const sgn = (x, d = 1) => x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const pct = x => x == null ? '–' : Math.round(x) + '%';
const dateLabel = d => new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
const timeLabel = st => st ? new Date(st).toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Vancouver' }) : '';

/* ---------- maths shared with the build ---------- */
// Category average: PCAHA and Island teams only, so visiting tournament teams don't move the baseline.
function catMean(D, cat) {
  const ts = Object.values(D.teams).filter(t => t.c === cat && t.rg !== 'visitor');
  return ts.reduce((s, t) => s + t.net, 0) / Math.max(ts.length, 1);
}
function power(D, t) { return t.net - catMean(D, t.c); }
function poisson(l, n = 20) { const p = [Math.exp(-l)]; for (let k = 1; k <= n; k++) p.push(p[k - 1] * l / k); return p; }
// Same as scripts/model.py: the odds are averaged over how unsure we are of each
// team's rating (t.u = offence variance, defence variance, covariance), times 3.
const GH_X = [-4.512746, -3.205429, -2.076848, -1.023256, 0, 1.023256, 2.076848, 3.205429, 4.512746];
const GH_W = [0.00002235, 0.00278914, 0.04991641, 0.24409750, 0.40634921, 0.24409750, 0.04991641, 0.00278914, 0.00002235];
const UNC_SCALE = 3;
function wtl(lh, la) {
  const ph = poisson(lh), pa = poisson(la); let H = 0, T = 0, A = 0;
  for (let i = 0; i < ph.length; i++) for (let j = 0; j < pa.length; j++) { const p = ph[i] * pa[j]; if (i > j) H += p; else if (i === j) T += p; else A += p; }
  return [H, T, A];
}
function matchup(D, h, a) {
  const lh = h.off * a.def / D.avgGoals, la = a.off * h.def / D.avgGoals;
  const uh = h.u || [0, 0, 0], ua = a.u || [0, 0, 0];
  const vh = UNC_SCALE * (uh[0] + ua[1]), va = UNC_SCALE * (ua[0] + uh[1]), cv = -UNC_SCALE * (uh[2] + ua[2]);
  const c11 = Math.sqrt(Math.max(vh, 1e-12)), c21 = cv / c11, c22 = Math.sqrt(Math.max(va - c21 * c21, 1e-12));
  const q = [0, 0, 0];
  for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) {
    const w = GH_W[i] * GH_W[j]; if (w < 1e-7) continue;
    const r = wtl(Math.min(Math.max(lh * Math.exp(c11 * GH_X[i]), 0.02), 30), Math.min(Math.max(la * Math.exp(c21 * GH_X[i] + c22 * GH_X[j]), 0.02), 30));
    q[0] += w * r[0]; q[1] += w * r[1]; q[2] += w * r[2];
  }
  const s = q[0] + q[1] + q[2];
  // Same as display_goals in model.py: big predicted margins are scaled back past 4 goals.
  let eh = lh, ea = la; const mg = Math.abs(lh - la);
  if (mg > 4) { const adj = 4 + (mg - 4) * 0.65; if (lh >= la) eh = la + adj; else ea = lh + adj; }
  return { ph: q[0] / s * 100, pt: q[1] / s * 100, pa: q[2] / s * 100, eh, ea };
}

/* ---------- strength bar (no percentages shown) ---------- */
// The model's numbers decide the bar and the words; the numbers themselves are
// not shown per game. They're graded in aggregate on the Track record page.
function edgeWord(share) {  // share = favourite's share of decisive outcomes, 0.5..1
  return share < 0.57 ? 'Even' : share < 0.68 ? 'Slight edge' : share < 0.82 ? 'Clear edge' : 'Strong favourite';
}
function strengthBar(ph, pt, pa, A, B, opts = {}) {
  const left = ph + pt / 2, share = Math.max(ph, pa) / Math.max(ph + pa, 1e-9), word = edgeWord(share);
  const fav = ph >= pa ? A : B;
  const label = word === 'Even' ? 'Even matchup' : `${word}: ${shortName(fav)}`;
  const nameA = opts.homeAway ? `${shortName(A)} (home)` : shortName(A), nameB = opts.homeAway ? `${shortName(B)} (away)` : shortName(B);
  return `<div class="sbar${opts.small ? ' small' : ''}" role="img" tabindex="0" data-tip="odds" aria-label="${esc(label)}">
    ${opts.small || opts.noNames ? '' : `<div class="sbar-names"><span>${esc(nameA)}</span><span>${esc(nameB)}</span></div>`}
    <div class="sbar-track"><i class="sa" style="width:${left.toFixed(1)}%"></i><i class="sb" style="width:${(100 - left).toFixed(1)}%"></i></div>
    ${opts.small ? '' : `<div class="sbar-label ${word === 'Even' ? '' : ph >= pa ? 'fa' : 'fb'}">${esc(label)}</div>`}
  </div>`;
}
const upsetWord = p => p <= 10 ? 'a big upset' : 'an upset';
function sideWord(p) {  // a team's own pre-game chance (0-100, ties included) as words
  if (p == null) return '–';
  const share = Math.min(Math.max(p / 87, 0), 1);
  return share >= 0.82 ? 'Strong favourite' : share >= 0.68 ? 'Favourite' : share >= 0.57 ? 'Slight favourite' : share > 0.43 ? 'Even' : share > 0.32 ? 'Close, slight edge to them' : share > 0.18 ? 'Tough game' : 'Big challenge';
}

/* ---------- share links (live site only: the /s/ pages are built on Netlify) ---------- */
const CAN_SHARE = !/claude\.ai$|claudeusercontent\.com$|^localhost$|^127\./.test(location.hostname);
function shareBtn(key, title) {
  if (!CAN_SHARE) return '';
  return `<button type="button" class="sharebtn" data-share="${esc(key)}" data-title="${esc(title)}">Share</button>`;
}
function toast(msg) {
  let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 2500);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-share]'); if (!b) return;
  const url = `${location.origin}/s/${b.dataset.share}.html`;
  try { if (navigator.share) { await navigator.share({ title: b.dataset.title, url }); return; } } catch (err) { if (err && err.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied. Paste it into your team chat.'); }
  catch (err) { toast(url); }
});

/* ---------- routing ---------- */
function parseHash() {
  const h = location.hash.slice(1);
  if (GLOBAL_VIEWS.has(h)) return { view: h };
  const m = h.match(/^(u\d+)-(home|rankings|week|games|leagues|record|team|game|match)(?:-(\d+))?(?:-(\d+))?$/);
  if (!m) return { div: S.div, view: 'home' };
  return { div: m[1], view: m[2], team: m[3] ? +m[3] : null, team2: m[4] ? +m[4] : null };
}
function go(h) { if (location.hash !== '#' + h) location.hash = h; else render(); }

function chrome() {
  $('#levels').innerHTML = LEVELS.map(([k, n]) => `<button type="button" data-level="${k}" aria-pressed="${S.level === k}">${n}</button>`).join('');
  $('#modes').innerHTML = [['simple', 'Simple'], ['detailed', 'Detailed']].map(([k, n]) => `<button type="button" data-mode="${k}" aria-pressed="${(k === 'simple') === S.simple}">${n}</button>`).join('');
  $('#genders').innerHTML = GENDERS.map(([k, n]) => `<button type="button" data-gender="${k}" aria-pressed="${S.gender === k}">${n}</button>`).join('');
  $('#divs').innerHTML = S.index.divisions.map(d =>
    `<button type="button" data-div="${d.id}" aria-pressed="${d.id === S.div}">${d.name}</button>`).join('');
  $('#brand').setAttribute('href', `#${S.div}-home`);
  $('#views').innerHTML = VIEWS.map(([k, n]) => {
    const href = GLOBAL_VIEWS.has(k) ? `#${k}` : `#${S.div}-${k}`;
    const cur = S.view === k || (k === 'rankings' && S.view === 'team') || (k === 'games' && (S.view === 'game' || S.view === 'match'));
    return `<a href="${href}" ${cur ? 'aria-current="page"' : ''}>${n}</a>`;
  }).join('');
  const upd = S.index.dataUpdated ? new Date(S.index.dataUpdated).toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'America/Vancouver' }) : '';
  $('#foot').innerHTML = `RinkRank is an independent site, not affiliated with PCAHA, BC Hockey or Spordle. Game results come from the public PCAHA Spordle data via the open
    <a href="https://github.com/ecoTokenJames/pcaha-stats" target="_blank" rel="noopener">pcaha-stats</a> project. Data as of ${esc(upd)}. ${esc(S.index.season || '')} season.
    Team-level numbers only. Official results live at <a href="https://games.pcaha.ca" target="_blank" rel="noopener">games.pcaha.ca</a>.
    <br><b>RinkRank is for fun and information only. Please don't bet on minor hockey. These are kids' games.</b>`;
}

async function render() {
  const r = parseHash();
  S.view = r.view; if (r.div) S.div = r.div; S.team = r.team ?? null;
  if (!S.index.divisions.some(d => d.id === S.div)) S.div = S.index.divisions[0].id;
  chrome();
  const app = $('#app');
  if (S.view === 'method') { app.innerHTML = viewMethod(); window.scrollTo(0, 0); return; }
  if (S.view === 'search') {
    app.innerHTML = viewSearchShell(); bindSearch(); window.scrollTo(0, 0);
    try { await Promise.all(S.index.divisions.map(d => loadDiv(d.id))); } catch (e) { $('#sres').innerHTML = '<p class="note">Some age groups didn\'t load. Refresh to try again.</p>'; return; }
    runSearch(); return;
  }
  if (S.view === 'clubs') {
    app.innerHTML = '<p class="loading">Loading clubs…</p>';
    try { S.clubs ||= await getJSON('data/associations.json'); } catch (e) { app.innerHTML = '<p class="loading">Couldn\'t load the club data. Refresh the page to try again.</p>'; return; }
    app.innerHTML = viewClubs(S.clubs); bindClubs(); window.scrollTo(0, 0); return;
  }
  app.innerHTML = '<p class="loading">Loading ratings…</p>';
  let D;

function pickFeatured(D, games) {

  let best = null, bestScore = -1e9;
  for (const g of games) {

    const score = (h.cpct + a.cpct) / 2 - Math.abs(g.ph - g.pa) * 0.8;

}

/* ---------- rankings ---------- */
function levelCats(D) { return D.cats.filter(x => inLevel(x.c)); }
function currentCat(D) {
  const cats = levelCats(D).map(c => c.c);
  if (!cats.includes(S.cat[S.div])) {
    const pref = cats.find(c => / A$/.test(c)) || cats[0];
    S.cat[S.div] = pref;
  }
  return S.cat[S.div];
}
function rankedList(D, cat, region) {
  let ts = Object.values(D.teams).filter(t => t.c === cat && (region === 'all' ? t.rg !== 'visitor' : t.rg === region));
  ts.sort((a, b) => b.net - a.net);
  const prev = ts.filter(t => t.prevNet != null).slice().sort((a, b) => b.prevNet - a.prevNet);
  const pr = new Map(prev.map((t, i) => [t.id, i + 1]));
  return ts.map((t, i) => ({ t, rank: i + 1, move: pr.has(t.id) ? pr.get(t.id) - (i + 1) : null }));
}
function moveCell(m) {
  if (m == null) return '<span class="mv flat">new</span>';
  if (m === 0) return '<span class="mv flat">–</span>';
  return m > 0 ? `<span class="mv up">▲${m}</span>` : `<span class="mv down">▼${-m}</span>`;
}
// Stored oldest-first; shown newest on the left, matching the game-by-game list.
function formCell(f) { const r = [...f].reverse(); return `<span class="form" aria-label="Last five, newest first: ${esc(r.join(' '))}">${r.map(x => `<b class="${x}">${x}</b>`).join('')}</span>`; }
function powerCell(v, scale = 6) {
  const w = Math.min(Math.abs(v) / scale, 1) * 50;
  const style = v >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%;background:var(--red)`;
  return `<span class="power"><span class="num">${sgn(v)}</span><span class="pbar" aria-hidden="true"><i style="${style}"></i></span></span>`;
}
const SORTS = {
  power: r => -r.t.net, off: r => -r.t.off, def: r => r.t.def, sos: r => -(r.t.sos ?? -99),
  luck: r => -(r.t.ptsPct - r.t.xPtsPct), pp: r => -(r.t.st.pp ?? -1), pk: r => -(r.t.st.pk ?? -1), rec: r => -r.t.ptsPct,
};
function viewRankings(D) {
  if (!levelCats(D).length) return `<p class="eyebrow">${esc(D.div)} ${levelName()} power rankings</p><h1>No teams here</h1><p class="lede">There are no ${esc(D.div)} ${levelName()} teams in this season's data. Try the other switches at the top.</p>`;

  rows = rows.slice().sort((a, b) => SORTS[S.sort](a) - SORTS[S.sort](b));
  const mean = catMean(D, cat);

  const th = (k, label, cls = '') => `<th class="${cls}"><button type="button" data-sort="${k}" data-active="${S.sort === k}"${tipAttr(TIPK[k])}>${label}${S.sort === k ? ' ↓' : ''}</button></th>`;

  </div>

    <label><span class="eyebrow" style="margin-right:6px">Find</span><input type="search" id="q" placeholder="Team or association" value="${esc(S.q)}"></label>
  </div>
  <div class="tframe"><table>
    <thead><tr><th class="l">${tipSpan('rank', '#')}</th><th class="l">${tipSpan('move', '±')}</th><th class="l">Team</th>${th('rec', 'Record')}${th('power', 'Power')}
      ${th('off', 'GF*', 'hide-sm adv')}${th('def', 'GA*', 'hide-sm adv')}${th('sos', 'Sched', 'hide-sm adv')}${th('luck', 'Rec vs play', 'hide-sm adv')}
      <th class="l">${tipSpan('form', 'Last 5')}</th>${th('pp', 'PP', 'hide-sm adv')}${th('pk', 'PK', 'hide-sm adv')}</tr></thead>
    <tbody>${rows.map(({ t, rank, move }) => {

        <td class="num hide-sm adv ${luck >= 10 ? 'up' : luck <= -10 ? 'down' : ''}">${sgn(luck, 0)}</td>
        <td class="l">${formCell(t.form)}</td>
        <td class="num hide-sm adv">${pct(t.st.pp)}</td><td class="num hide-sm adv">${pct(t.st.pk)}</td></tr>`;

  </table></div>
  <p class="note">${rows.length} of ${all} teams. GF* and GA* are goals for and against per game you'd expect against an average ${esc(D.div)} opponent. Sched is the average strength of opponents faced, against the ${esc(cat)} average. Rec vs play is points percentage minus the points percentage the team's play would usually earn. PP and PK are estimated from game sheets. <a href="#method">How it works</a>.</p>`;
}

function periodChart(t) {

        <rect x="${mid + 14}" y="${y + 16}" width="${f * sc}" height="12" rx="2" fill="var(--blue)"/>

  </svg><div class="oddslbl"><span>Against</span><span>For</span></div>`;
}
function rec(a) { return `${a[0]}-${a[1]}-${a[2]}`; }
function viewTeam(D, t) {

  return `
  <p class="eyebrow"><a href="#${S.div}-rankings" data-cat-link="${esc(t.c)}">${esc(t.c)} rankings</a></p>

  <p class="summary">${teamSummary(D, t)}</p>

    <div class="tile"><div class="k" tabindex="0" data-tip="power">Power</div><div class="v num">${sgn(pw)}</div><div class="s">goals a game vs an average ${esc(t.c)} team</div></div>

  </tbody></table></div>

    <div id="vsout" class="note">Pick an opponent to see the chances on neutral ice.</div></div>

/* ---------- games ---------- */
function gameCard(D, g, focus) {
  const h = D.teams[g.h], a = D.teams[g.a];
  const watch = isWatch(D, g);
  return `<article class="game${watch ? ' watch' : ''}">
    <div class="meta"><span>${esc(dateLabel(g.d))} ${esc(timeLabel(g.st))}</span><span>${watch ? '<span class="tag" tabindex="0" data-tip="watch">Game to watch</span>' : esc((D.schedules[g.s] || {}).n || '')}</span></div>
    <div class="side"><a href="#${S.div}-team-${h.id}"${focus === h.id ? ' style="color:var(--blue)"' : ''}>${esc(h.n)}</a><span class="note">home</span></div>
    <div class="side"><a href="#${S.div}-team-${a.id}"${focus === a.id ? ' style="color:var(--blue)"' : ''}>${esc(a.n)}</a><span class="note">away</span></div>
    ${strengthBar(g.ph, g.pt, g.pa, h, a, { noNames: true })}
    <div class="meta"><span>${esc(g.ar || '')}</span><a href="#${S.div}-game-${g.g}" class="preview">Scouting report →</a></div>
  </article>`;
}
function isWatch(D, g) {
  const h = D.teams[g.h], a = D.teams[g.a];
  if (!h || !a || h.c !== a.c) return false;
  const close = Math.abs(g.ph - g.pa) <= 20;
  return close && h.rank && a.rank && h.rank <= Math.ceil(h.of / 4) && a.rank <= Math.ceil(a.of / 4);
}
function viewGames(D) {
  const cats = ['all', ...levelCats(D).map(c => c.c)];

  const games = D.upcoming.filter(inCat);
  const byDay = {}; games.forEach(g => (byDay[g.d] ||= []).push(g));

  <div class="controls"><div class="chips" role="group" aria-label="Category">${cats.map(c => `<button type="button" class="chip" data-gcat="${esc(c)}" aria-pressed="${c === S.gamesCat}">${c === 'all' ? 'All' : esc(c)}</button>`).join('')}</div></div>
  ${games.length ? `<div class="days">${Object.entries(byDay).map(([d, gs]) => `<section class="day"><h3>${esc(dateLabel(d))}</h3><div class="games">${gs.map(g => gameCard(D, g)).join('')}</div></section>`).join('')}</div>`
    : '<p class="note">No games scheduled in the next two weeks for this selection.</p>'}
  <h2>Upsets, last 30 days</h2>
  <p class="note">Results where the winner faced a tough game or a big challenge going in.</p>
  <div class="tframe"><table><thead><tr><th class="l">Date</th><th class="l">Winner</th><th class="l">Loser</th><th>Score</th><th class="l">${tipSpan('upset', 'Winner going in')}</th></tr></thead>
  <tbody>${ups.map(u => { const hw = u.hs > u.as; const w = D.teams[hw ? u.h : u.a], l = D.teams[hw ? u.a : u.h];
    return `<tr><td class="l num">${esc(u.d.slice(5))}</td><td class="l team"><a href="#${S.div}-team-${w.id}">${esc(w.n)}</a></td><td class="l team"><a href="#${S.div}-team-${l.id}">${esc(l.n)}</a></td><td class="num">${Math.max(u.hs, u.as)}-${Math.min(u.hs, u.as)}</td><td class="l">${sideWord(u.p)}</td></tr>`; }).join('') || '<tr><td class="l" colspan="5">No big upsets in this selection.</td></tr>'}</tbody></table></div>`;
}

/* ---------- leagues ---------- */
function viewLeagues(D) {

  const lp = D.projections.filter(p => inLevel(p.cat));

    ${p.groups.map(g => `${g.name ? `<h3>${esc(g.name)}</h3>` : ''}
    <div class="tframe" style="margin-bottom:14px"><table><thead><tr><th class="l">Team</th><th>${tipSpan('pts', 'Pts')}</th><th>${tipSpan('gp', 'GP')}</th><th class="hide-sm">${tipSpan('left', 'Left')}</th><th>${tipSpan('projected', 'Projected')}</th><th>${tourn ? tipSpan('poolwin', 'Pool win') : tipSpan('p1', '1st')}</th><th>${tipSpan('top', 'Top half')}</th><th class="hide-sm adv">${tipSpan('avgfin', 'Avg finish')}</th>${tourn ? '' : `<th class="l">${tipSpan('need', 'For top half')}</th>`}<th class="l">${tipSpan('status', 'Status')}</th></tr></thead>
    <tbody>${g.rows.map(r => { const t = D.teams[r.id];
      return `<tr><td class="l team">${t ? `<a href="#${S.div}-team-${t.id}">${esc(t.n)}</a>` : r.id}</td><td class="num">${r.pts}</td><td class="num">${r.gp}</td><td class="num hide-sm">${r.left}</td><td class="num"><b>${fmt(r.xPts)}</b></td><td class="num">${pct(r.p1)}</td><td class="num">${pct(r.top)}</td><td class="num hide-sm adv">${fmt(r.avg)}</td>${tourn ? '' : `<td class="l">${needCell(r)}</td>`}<td class="l status">${r.status ? `<span class="${/Clinched|clinched/.test(r.status) ? 'up' : /Out of/.test(r.status) ? 'down' : ''}">${esc(r.status)}</span>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`).join('')}
  `).join('') : '<p class="note">Nothing with games left in this age group yet. Rep leagues appear here once PCAHA publishes the season schedule.</p>'}`;
}

/* ---------- method ---------- */
function viewMethod() {
  const ev = S.index.evaluation;
  const cal = ev ? calChart(ev.calibration) : '';
  const pc = v => (v * 100).toFixed(1) + '%';
  const segTable = (obj, label) => `<div class="tframe" style="margin:8px 0 14px"><table><thead><tr><th class="l">${label}</th><th>Games</th><th>Winner called</th></tr></thead><tbody>${Object.entries(obj).map(([k, v]) => `<tr><td class="l">${esc(k)}</td><td class="num">${v.games.toLocaleString()}</td><td class="num">${pc(v.accuracy)}</td></tr>`).join('')}</tbody></table></div>`;
  return `
  <p class="eyebrow">Methodology</p>
  <h1>How the ratings work</h1>
  <div style="max-width:70ch">
  <p>Standings tell you who has won. They don't tell you who they beat, or whether a 6-0 record came against the top of the table or the bottom. RinkRank rates every team on every game it has played, including placement rounds, league games and tournaments, so teams in different leagues and tiers can be compared through the opponents they share.</p>
  <h2>The model</h2>
  <p>Each team gets an offence rating and a defence rating. A team's expected goals in a game depend on its offence and the opponent's defence. The ratings are the values that best explain every score this season. Scores are capped at nine goals per side, so a 15-0 mismatch doesn't count more than a 9-0.</p>
  <p>Each team starts the season from two clues, weighted equally. One is last season's rating for the same slot: same association, age group and team number, such as Vancouver Thunderbird U13 A2. The other follows the players: the average standing of the teams this season's players played for last year. A player moving up from U11 counts at their old team's standing in U11, so a kid from a top-10% U11 team counts as top-10% material. This season's results then take over, and after about ten games the starting point barely matters.</p>
  <p>Why both? In a normal year clubs move players through the same slots, and the slot alone is slightly better. But when programs change, following the players catches it. In 2026-27 the new U13 AA league drew top players away from several associations' A teams. Over each U13 A team's first five games this season, following the players called ${S.index.evaluation && S.index.evaluation.u13aThisSeason ? Math.round(S.index.evaluation.u13aThisSeason.blend * 100) : 64}% of winners against ${S.index.evaluation && S.index.evaluation.u13aThisSeason ? Math.round(S.index.evaluation.u13aThisSeason.slot * 100) : 61}% for the slot alone. The 50/50 mix is the only version that did as well or better in every season tested.</p>
  <p>Power is the goal differential per game you'd expect against an average team in the same category. Win, tie and loss chances come from the two teams' expected goals, averaged over how sure the model is of each team. A team with only a few games, or whose games are mostly against teams with few links to the rest of the league, could plausibly be a lot better or worse than its rating, so its odds stay closer to even. A team with a full season against well-connected opponents gets sharper odds. How wide that range should be was tuned on past seasons, and the projections use the same uncertainty when they play out the rest of a league. Expected scores are trimmed in big mismatches, where the favourite tends to ease off: past a four-goal margin, the shown margin is scaled back to match what actually happened in three seasons of games.</p>
  <p>On the site, game odds appear as a strength bar with plain words (Even, Slight edge, Clear edge, Strong favourite) rather than percentages. These are kids' games, and "a 4% chance" on a public page about a team of eleven-year-olds isn't something we want to publish. The numbers behind the bars are the same ones graded below.</p>
  <h2>Does it work?</h2>
  ${ev ? `<p>We replayed three full seasons, ${ev.games.toLocaleString()} games in all. Each week the model was fitted only on games already played and asked to call the next week. Each season was graded with settings fitted on the other two, so no season marks its own homework.</p>
  <div class="tframe" style="margin:8px 0 14px"><table><thead><tr><th class="l">Season</th><th>Games</th><th>Winner called</th><th class="hide-sm">${tipSpan('logloss', 'Odds error')}</th><th class="hide-sm">Before tuning</th></tr></thead>
  <tbody>${ev.seasons.map(x => `<tr><td class="l">${esc(x.season)}</td><td class="num">${x.games.toLocaleString()}</td><td class="num">${pc(x.accuracy)}</td><td class="num hide-sm">${x.logLoss.toFixed(3)}</td><td class="num hide-sm">${x.beforeLogLoss.toFixed(3)}</td></tr>`).join('')}</tbody></table></div>
  <p>The model calls about ${Math.round(ev.accuracy * 100)}% of winners across every game, including teams' first games of the season, and about ${Math.round((ev.accuracy3plus || 0.72) * 100)}% once both teams have three games in. On ${'2025-26'}, picking the team with the better record got about ${Math.round(ev.baselineRecord2025 * 100)}%. Odds error (lower is better) measures how good the percentages are, not just the picks; accounting for how sure the model is of each team cut it by 7 to 11% in every season.</p>
  <h3>When it says 70%…</h3>
  <p>If the odds are honest, teams given 70% win about 70% of the time. Across all three seasons:</p>${cal}
  <h3>Where it's stronger and weaker</h3>
  <p>Games are harder to call as players get older, and a team's first game of the season is close to a coin flip, which is why those odds are kept modest. Tournaments, with teams from outside PCAHA, are harder than league games.</p>
  <div class="grid2">${segTable(ev.byAge, 'Age group')}${segTable(ev.byGames, 'Fewer games played')}</div>
  <div class="grid2">${segTable(ev.byType, 'Game type')}${segTable(ev.byLevel, 'Level')}</div>` : ''}
  ${trustSection(WEEKLY)}
  <h2>Keeping score</h2>
  <p>The <a href="#${S.div}-record">Track record</a> page grades every game this season against the odds the model gave before it was played. Before launch those odds are replayed, with the model refitted on only the games from earlier days. From launch on, the odds shown on the site at the last update before each game are saved and never changed afterwards, so the record can't be quietly improved.</p>
  <h2>Clubs</h2>
  <p><b>Club report cards</b> average each association's team percentiles within their own categories, so a club isn't rewarded for having more A teams than C teams.</p>
  <h2>Other numbers</h2>
  <p><b>Schedule strength</b> is the average power of the opponents a team has played. <b>Record vs play</b> compares a team's points percentage with the points percentage its game-by-game chances would usually earn; big gaps tend to close. <b>Power play and penalty kill</b> are estimated from game sheets: power-play chances are the opponent's minor, major and match penalties, which slightly overcounts when penalties are coincidental. <b>Projections</b> play out each league's remaining schedule thousands of times.</p>
  <h2>What every number means</h2>
  <p class="note">The same explanations appear when you hover over (or tap) any underlined label on the site.</p>
  <dl class="gloss">${['level','gender','power','gf','ga','record','move','hist','sched','luck','form','pp','pk','early','region','cpct','topq','odds','watch','winchance','vsexp','upset','projected','p1','top','avgfin','poolwin','status','trend','picked','baseline','confident','calib','source','splits','depth'].map(k => `<dt>${esc(GLOSS[k][0])}</dt><dd>${esc(GLOSS[k][1])}</dd>`).join('')}</dl>
  <h2>Not for betting</h2>
  <p>The odds and projections here are a way to understand the season, not a prediction to wager on. Betting on youth sports is a bad idea and is against the spirit of minor hockey.</p>
  <h2>What we don't publish</h2>
  <p>These are kids' games. RinkRank shows team numbers only. Player names and individual stats stay on the official PCAHA site. The ratings use player IDs from the public data for one thing: linking each team to the teams its players came from last season. No player information is shown, stored or shared by this site.</p>
  <h2>Limits</h2>
  <p>Early in the season ratings move a lot, and teams with fewer than six games are marked EARLY. Island and visiting tournament teams are rated through the few games that link them to PCAHA teams, so treat cross-region comparisons with care. Rosters change, players get hurt, and goalies matter more than any rating can show.</p>
  </div>`;
}
// "When can you trust the projections?": the week-by-week replay of past leagues (scripts/test_weekly.py).
// Fixed results from past seasons, so they live here rather than in the nightly data.
const WEEKLY = {"seasons":["2024-25","2025-26"],"leagues":64,"rows":[{"played":0,"modelTopHalf":0.692,"standingsTopHalf":0.564,"modelWinner":0.392,"standingsWinner":0.184},{"played":10,"modelTopHalf":0.776,"standingsTopHalf":0.724,"modelWinner":0.523,"standingsWinner":0.341},{"played":20,"modelTopHalf":0.819,"standingsTopHalf":0.76,"modelWinner":0.554,"standingsWinner":0.431},{"played":30,"modelTopHalf":0.843,"standingsTopHalf":0.799,"modelWinner":0.618,"standingsWinner":0.484},{"played":40,"modelTopHalf":0.858,"standingsTopHalf":0.822,"modelWinner":0.684,"standingsWinner":0.547},{"played":50,"modelTopHalf":0.88,"standingsTopHalf":0.843,"modelWinner":0.726,"standingsWinner":0.626},{"played":60,"modelTopHalf":0.905,"standingsTopHalf":0.879,"modelWinner":0.745,"standingsWinner":0.686},{"played":70,"modelTopHalf":0.928,"standingsTopHalf":0.906,"modelWinner":0.763,"standingsWinner":0.734},{"played":80,"modelTopHalf":0.934,"standingsTopHalf":0.926,"modelWinner":0.867,"standingsWinner":0.796},{"played":90,"modelTopHalf":0.974,"standingsTopHalf":0.955,"modelWinner":0.914,"standingsWinner":0.874}],"calibration":[{"stage":"early","predicted":0.749,"actual":0.761,"n":564}]};
function trustSection(w) {
  const r = w.rows, at = p => r.find(x => x.played === p) || r[0];
  const a = at(0), h = at(50);
  const e75 = (() => { const c = w.calibration.filter(x => x.stage === 'early' && x.predicted >= 0.7 && x.predicted < 0.8); return c.length ? c[0] : null; })();
  return `<h2>When can you trust the projections?</h2>
  <p>We replayed every league from the last two seasons (${w.leagues} leagues, ${esc(w.seasons.join(' and '))}) one week at a time. Each week the model saw only the games played so far, projected the rest of the league the same way this site does, and was checked against how the league really finished. The simple alternative is to trust the standings as they are that week.</p>
  ${trustChart(r, 'modelTopHalf', 'standingsTopHalf', 'Top-half finish called right', 50)}
  <p>In the first tenth of a league, the projections called top-half finishes right for ${pct(a.modelTopHalf * 100)} of teams, against ${pct(a.standingsTopHalf * 100)} for the standings. By the halfway point it was ${pct(h.modelTopHalf * 100)} against ${pct(h.standingsTopHalf * 100)}. The model stays ahead all season, and the gap is widest in the first few weeks, when the standings have the least to go on.</p>
  ${trustChart(r, 'modelWinner', 'standingsWinner', 'Eventual first-place team picked', 0)}
  <p>Picking the team that finishes first is harder. In the first tenth of a league the model's top pick won the group ${pct(a.modelWinner * 100)} of the time, against ${pct(a.standingsWinner * 100)} for the early leader. By halfway it was ${pct(h.modelWinner * 100)} against ${pct(h.standingsWinner * 100)}.</p>
  <p>The percentages are honest early as well as late.${e75 ? ` Teams given about ${pct(e75.predicted * 100)} for a top-half finish in the first third of the season made it ${pct(e75.actual * 100)} of the time.` : ''} So an early-season number isn't a guess dressed up as a percentage: it already says how unsure it is, and it gets sharper as games are played.</p>`;
}
function trustChart(rows, mk, sk, label, floor) {
  const W = 600, H = 230, L = 40, R = 12, T = 14, B = 46, lo = floor / 100;
  const x = p => L + p / 90 * (W - L - R), y = v => T + (1 - (v - lo) / (1 - lo)) * (H - T - B);
  const line = k => rows.filter(r => r[k] != null).map(r => `${x(r.played).toFixed(1)},${y(r[k]).toFixed(1)}`).join(' ');
  const ticks = []; for (let v = lo; v <= 1.001; v += floor ? 0.1 : 0.2) ticks.push(+v.toFixed(2));
  return `<figure style="margin:8px 0 14px"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)} by share of league played, model against standings">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="var(--muted)" style="font:11px var(--mono)">${Math.round(v * 100)}%</text>`).join('')}
    ${[0, 30, 60, 90].map(p => `<text x="${x(p)}" y="${H - B + 16}" text-anchor="middle" fill="var(--muted)" style="font:11px var(--mono)">${p}%</text>`).join('')}
    <text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle" fill="var(--muted)" style="font:11px var(--mono)">Share of league games played</text>
    <polyline points="${line(sk)}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-dasharray="6 4"/>
    <polyline points="${line(mk)}" fill="none" stroke="var(--blue)" stroke-width="3"/>
    ${rows.map(r => `<circle cx="${x(r.played)}" cy="${y(r[mk])}" r="3.5" fill="var(--blue)"><title>${r.played}% played: model ${Math.round(r[mk] * 100)}%, standings ${Math.round(r[sk] * 100)}%</title></circle>`).join('')}
  </svg>
  <figcaption class="note" style="display:flex;gap:16px;flex-wrap:wrap"><b style="color:var(--ink)">${esc(label)}</b><span><span style="color:var(--blue)">━</span> RinkRank projection</span><span><span style="color:var(--red)">╍</span> Standings that week</span></figcaption></figure>`;
}
function calChart(rows) {
  const W = 420, H = 260, L = 46, B = 36, T = 10, R = 12, x = v => L + (v - .5) / .5 * (W - L - R), y = v => H - B - (v - .5) / .5 * (H - B - T);
  const ticks = [.5, .6, .7, .8, .9, 1];
  return `<svg class="cal" viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted against actual win rate">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v * 100}%</text><text x="${x(v)}" y="${H - B + 16}" text-anchor="middle">${v * 100}%</text>`).join('')}
    <line x1="${x(.5)}" y1="${y(.5)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    <polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${rows.map(r => `${x(r.predicted)},${y(r.actual)}`).join(' ')}"/>
    ${rows.map(r => `<circle cx="${x(r.predicted)}" cy="${y(r.actual)}" r="4" fill="var(--blue)"><title>${Math.round(r.predicted * 100)}% predicted, ${Math.round(r.actual * 100)}% won, ${r.games} games</title></circle>`).join('')}
    <text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">Favourite's predicted chance</text>
    <text x="12" y="${(T + H - B) / 2}" text-anchor="middle" transform="rotate(-90 12 ${(T + H - B) / 2})">How often they won</text>
  </svg>`;
}

/* ---------- my teams (saved on this device only) ---------- */
function stars() { try { return JSON.parse(store('rr-stars') || '[]'); } catch (e) { return []; } }
function isStar(div, id) { return stars().includes(`${div}:${id}`); }
function toggleStar(key) { const s = stars(); store('rr-stars', JSON.stringify(s.includes(key) ? s.filter(x => x !== key) : [...s, key])); }
function starBtn(div, id, big) {
  const on = isStar(div, id), lbl = on ? 'Remove from my teams' : 'Add to my teams';
  return `<button type="button" class="star${big ? ' big' : ''}" data-star="${div}:${id}" aria-pressed="${on}" aria-label="${lbl}" title="${lbl}">${on ? '★' : '☆'}</button>`;
}
const moveText = m => m == null ? '' : m > 0 ? `▲${m}` : m < 0 ? `▼${-m}` : '';
function mineSection(hintIfEmpty) {

async function fillMine() {

function mineCard(D, div, t) {
  const r = t.rg === 'visitor' ? null : rankedList(D, t.c, t.rg).find(x => x.t.id === t.id);

    <b>${esc(t.n)}</b>

/* ---------- rating history chart ---------- */
const shortDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
function niceStep(range) { for (const s of [0.5, 1, 2, 2.5, 5, 10]) if (range / s <= 6) return s; return 20; }
function histChart(t) {
  const h = t.hist;
  if (h.length < 2) return '<p class="note">The chart starts once a team has two weeks of results.</p>';
  const W = 600, H = 220, L = 38, R = 46, T = 22, B = 30;
  const vs = h.map(p => p[1]); let lo = Math.min(0, ...vs), hi = Math.max(0, ...vs);
  const pad = Math.max(0.5, (hi - lo) * 0.15); lo -= pad; hi += pad;
  const step = niceStep(hi - lo), ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(+v.toFixed(2));
  const x = i => L + i * (W - L - R) / (h.length - 1), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const pts = h.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  const every = Math.ceil(h.length / 7);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Power by week, from ${sgn(h[0][1])} to ${sgn(h[h.length - 1][1])}">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? 'stroke-width="1.5" stroke-dasharray="5 4"' : ''}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="var(--muted)" style="font:11px var(--mono)">${sgn(v, step < 1 ? 1 : 0)}</text>`).join('')}
    <text x="${W - R + 4}" y="${y(0) + 4}" fill="var(--muted)" style="font:10px var(--mono)">avg</text>
    <polygon points="${x(0)},${y(0)} ${pts} ${x(h.length - 1)},${y(0)}" fill="var(--blue)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>
    ${h.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[1])}" r="${i === h.length - 1 ? 5 : 3.5}" fill="${i === h.length - 1 ? 'var(--red)' : 'var(--blue)'}"><title>${shortDate(p[0])}: ${sgn(p[1])} power, ranked ${p[2]}</title></circle>`).join('')}
    ${h.map((p, i) => (i % every === 0 || i === h.length - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" fill="var(--muted)" style="font:11px var(--mono)">${shortDate(p[0])}</text>` : '').join('')}
    <text x="${x(0)}" y="${y(h[0][1]) - 9}" text-anchor="middle" fill="var(--ink)" style="font:600 12px var(--mono)">#${h[0][2]}</text>
    <text x="${x(h.length - 1)}" y="${y(h[h.length - 1][1]) - 10}" text-anchor="middle" fill="var(--ink)" style="font:600 12px var(--mono)">#${h[h.length - 1][2]}</text>
  </svg>`;
}

function heat(v) { return v == null ? '' : `style="background:color-mix(in srgb, var(--blue) ${Math.round(Math.max(0, v - 30) * 0.55)}%, transparent)"`; }
function clubRows(A) {

    const avg = Math.round(ts.reduce((x, t) => x + t.cpct, 0) / ts.length);
    return { a: a.a, teams: ts, n: ts.length, avg, top: ts.filter(t => t.cpct >= 75).length, divs, trend: [...past, [S.index.season || 'Now', avg]] };
  }).filter(Boolean).sort((x, y) => y.avg - x.avg || y.n - x.n);
}
function viewClubs(A0) {

function trendCell(tr) {
  const pts = tr.filter(([, v]) => v != null);
  if (pts.length < 2) return '<span class="note">new</span>';

  return `<span class="trend"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${ys(50)}" y2="${ys(50)}" stroke="var(--line)" stroke-dasharray="3 3"/><polyline points="${line}" fill="none" stroke="var(--blue)" stroke-width="2"/><circle cx="${xs(tr.length - 1)}" cy="${ys(last)}" r="2.8" fill="var(--red)"/></svg><span class="mv ${d > 0 ? 'up' : d < 0 ? 'down' : 'flat'}">${d > 0 ? '▲' + d : d < 0 ? '▼' + -d : '–'}</span></span>`;
}

/* ---------- this week ---------- */
function viewWeek(D) {
  const today = S.index.today, wk = new Date(new Date(today + 'T12:00:00') - 7 * 864e5).toISOString().slice(0, 10);
  const nextWk = new Date(new Date(today + 'T12:00:00').getTime() + 7 * 864e5).toISOString().slice(0, 10);
  const teams = Object.values(D.teams).filter(t => t.rg === 'pcaha' && inLevel(t.c));
  const movers = teams.filter(t => t.hist.length >= 2 && t.gp >= 4).map(t => {
    const cur = t.hist[t.hist.length - 1]; let prev = null;
    for (let i = t.hist.length - 2; i >= 0; i--) if (t.hist[i][0] <= wk) { prev = t.hist[i]; break; }
    return prev ? { t, from: prev[2], to: cur[2], d: prev[2] - cur[2] } : null;
  }).filter(Boolean);
  const risers = movers.filter(m => m.d > 0).sort((a, b) => b.d - a.d).slice(0, 6);
  const ups = D.upsets.filter(u => u.d >= wk && (inLevel(D.teams[u.h].c) || inLevel(D.teams[u.a].c))).slice(0, 6);
  const perf = [];
  teams.forEach(t => t.log.forEach(g => { if (g.d >= wk && g.pf >= 2.5) perf.push({ t, g }); }));
  perf.sort((a, b) => b.g.pf - a.g.pf);
  const streak = t => { let n = 0, kind = null; for (let i = t.log.length - 1; i >= 0; i--) { const r = t.log[i].r === 'W' ? 'W' : 'X'; if (kind == null) kind = r; if (r !== kind) break; n++; } return { kind, n }; };
  const hot = teams.map(t => ({ t, s: streak(t) })).filter(x => x.s.kind === 'W' && x.s.n >= 4).sort((a, b) => b.s.n - a.s.n).slice(0, 6);
  const watch = D.upcoming.filter(g => g.d <= nextWk && inLevel(D.teams[g.h].c) && isWatch(D, g)).slice(0, 8);
  const tl = t => `<a href="#${S.div}-team-${t.id}">${esc(t.n)}</a>`;
  const top = risers[0];
  const lead = top ? `${esc(top.t.n)} made the biggest move this week, up ${top.d} places to #${top.to} in ${esc(top.t.c)}.` : 'A quiet week in the rankings.';
  const li = (cls, html) => `<li class="${cls}">${html}</li>`;
  return `
  <p class="eyebrow">${esc(D.div)} · week to ${esc(dateLabel(today))}</p>
  <h1>This week in ${esc(D.div)} ${S.gender === 'female' ? 'Female ' : ''}${S.level === 'house' ? 'House' : 'Rep'}</h1>
  <p class="lede">${lead} ${ups.length ? `${ups.length} upset${ups.length > 1 ? 's' : ''} and ` : ''}${watch.length} game${watch.length === 1 ? '' : 's'} to watch in the week ahead.</p>
  ${mineSection(false)}
  <h2>Climbing</h2>
  <ul class="plain">${risers.map(m => li('', `<span class="mv up">▲${m.d}</span> ${tl(m.t)} <span class="note">${esc(m.t.c)}: #${m.from} → #${m.to}</span>`)).join('') || '<li class="note">No big moves.</li>'}</ul>
  <h2>Upsets</h2>
  ${ups.length ? `<ul class="plain">${ups.map(u => { const hw = u.hs > u.as, w = D.teams[hw ? u.h : u.a], l = D.teams[hw ? u.a : u.h];
    return li('', `${tl(w)} beat ${tl(l)} ${Math.max(u.hs, u.as)}-${Math.min(u.hs, u.as)} <span class="note">${esc(dateLabel(u.d))} · ${upsetWord(u.p)}</span>`); }).join('')}</ul>` : '<p class="note">No big upsets this week.</p>'}
  <h2>Standout performances</h2>
  ${perf.length ? `<ul class="plain">${perf.slice(0, 6).map(({ t, g }) => { const o = D.teams[g.o];
    return li('', `${tl(t)} ${g.r === 'W' ? 'beat' : g.r === 'T' ? 'tied' : 'lost to'} ${o ? tl(o) : 'an opponent'} ${g.gf}-${g.ga}, <b>${sgn(g.pf)}</b> goals better than expected <span class="note">${esc(dateLabel(g.d))}</span>`); }).join('')}</ul>` : '<p class="note">Nothing far above expectations this week.</p>'}
  <h2>On a roll</h2>
  <ul class="plain">${hot.map(x => li('', `${tl(x.t)} <span class="note">${x.s.n} straight wins</span>`)).join('') || '<li class="note">No team has won four straight.</li>'}</ul>
  <h2>Games to watch</h2>
  ${watch.length ? `<div class="games">${watch.map(g => gameCard(D, g)).join('')}</div>` : '<p class="note">No matchups between two top-quarter teams with close odds in the next seven days.</p>'}`;
}

/* ---------- matchup scouting report ---------- */
function shortName(t) {
  const club = t.a.replace(/\b(Minor Hockey Association|MHA|AHA|IHA|FHA|HA|Hockey|Association)\b/g, '').replace(/\s+/g, ' ').trim() || t.a;
  const m = t.n.match(/U\d+\s+(?:Female\s+)?([A-Z]{1,3}\d{1,2})\b/) || t.n.match(/\b(Tier \d)\b/);
  return m ? `${club} ${m[1]}` : t.n;
}
function findGame(D, gid) {
  const up = D.upcoming.find(g => g.g === gid);
  if (up) return { ...up, done: false };
  for (const t of Object.values(D.teams)) {
    const l = t.log.find(x => x.g === gid && x.h);
    if (l) { const m = matchup(D, t, D.teams[l.o] || t); return { g: gid, d: l.d, h: t.id, a: l.o, done: true, hs: l.gf, as: l.ga, s: l.s, ph: m.ph, pt: m.pt, pa: m.pa, eh: m.eh, ea: m.ea }; }
  }
  return null;
}
const penPG = t => t.sheets ? t.st.pen / t.sheets : null;
const perDiff = (t, p) => t.per[p][0] - t.per[p][1];
const topPct = p => `top ${Math.max(1, 100 - p)}%`;
const botPct = p => `bottom ${Math.max(1, p)}%`;
function matchKeys(D, A, B, m) {
  const keys = [];
  const nm = t => esc(shortName(t));
  const pa = A.pct || {}, pb = B.pct || {};
  // overall
  const fav = m.ph >= m.pa ? A : B, favP = Math.round(Math.max(m.ph, m.pa)), close = Math.abs(m.ph - m.pa) < 12;
  const word = edgeWord(Math.max(m.ph, m.pa) / Math.max(m.ph + m.pa, 1e-9));
  keys.push(word === 'Even'
    ? `An even matchup on paper. Either team can win this one.`
    : word === 'Slight edge' ? `${nm(fav)} have a slight edge, but this is well within reach for ${nm(fav === A ? B : A)}.`
    : word === 'Clear edge' ? `${nm(fav)} have a clear edge on paper. ${nm(fav === A ? B : A)} will need their best game.`
