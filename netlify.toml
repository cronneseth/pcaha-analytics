[build]
  # requirements.txt (Pillow) is installed by Netlify automatically.
  command = "python3 scripts/package_site.py site public && python3 scripts/share.py public"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"
  SITE_NAME = "RinkRank"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/cal/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=1800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
